<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Filter Produk</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }

    h2 {
      color: #333;
    }

    #cari {
      padding: 10px;
      width: 300px;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    #demo {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      padding: 16px;
      text-align: center;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .card h3 {
      margin: 0;
      color: #444;
    }

    .card p {
      margin: 6px 0;
      color: #666;
    }

    .card .harga {
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Daftar Produk</h2>

<input type="text" id="cari" placeholder="Cari produk...">
<div id="demo"></div>

<script>
const product = [
  { nama: 'Kemeja', harga: 70000, deskripsi: 'Kemeja Keren', gambar: 'gambar1.jpg' },
  { nama: 'Kaos', harga: 50000, deskripsi: 'Kaos Keren', gambar: 'gambar2.jpg' },
  { nama: 'Celana', harga: 60000, deskripsi: 'Celana Keren', gambar: 'gambar3.jpg' }
];

const demo = document.getElementById("demo");
const input = document.getElementById("cari");

function tampilkanProduk(data) {
  demo.innerHTML = "";
  data.forEach(item => {
    demo.innerHTML += `
      <div class="card">
        <img src="${item.gambar}" alt="${item.nama}" height="200">
        <h3>${item.nama}</h3>
        <p class="harga">Rp ${item.harga.toLocaleString("id-ID")}</p>
        <p>${item.deskripsi}</p>
      </div>
    `;
  });
}

tampilkanProduk(product);

input.addEventListener("input", () => {
  const keyword = input.value.toLowerCase();
  const hasilFilter = product.filter(p => p.nama.toLowerCase().includes(keyword));
  tampilkanProduk(hasilFilter);
});
</script>

</body>
</html>
